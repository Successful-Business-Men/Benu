<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Menu</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Serif+Display:ital@0;1&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Anton&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/motion@11.11.17/dist/motion.min.js"></script>
<style>
  /* ─── Design tokens (overridden per-template via applyTheme) ─── */
  :root {
    --bm-bg: #FBE8D6;
    --bm-surface: #FFFFFF;
    --bm-accent: #FF8A5C;
    --bm-accentDeep: #E76A39;
    --bm-soft: #FFF4E8;
    --bm-softDeep: #F5D9BD;
    --bm-text: #1F1A16;
    --bm-muted: #7E6F5F;
    --bm-rule: #1F1A16;
    --bm-heading-font: 'Plus Jakarta Sans', system-ui, sans-serif;
    --bm-body-font: 'Inter', system-ui, sans-serif;
  }
  html, body {
    background: var(--bm-bg);
    color: var(--bm-text);
    -webkit-font-smoothing: antialiased;
    font-family: var(--bm-body-font);
  }
  body { min-height: 100vh; }
  .bm-head { font-family: var(--bm-heading-font); }
  .bm-serif { font-family: 'Cormorant Garamond', serif; }
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { scrollbar-width: none; }

  /* Reveal primitive — used by every layout for staggered card entrances. */
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1); transition-delay: calc(var(--i, 0) * 60ms); }
  .reveal.in-view { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
  }

  /* ═══════════════════════════════════════════════════════════════════
     PURR — Counter dashboard.
     Sidebar + main + cart panel. Peach background, white surfaces,
     candied-orange accent. Inspired by Purr'Coffee.
     ═══════════════════════════════════════════════════════════════════ */
  [data-layout="purr"] body { background: var(--bm-bg); }
  .purr-shell {
    display: grid;
    grid-template-columns: 220px 1fr 320px;
    gap: 16px;
    padding: 16px;
    min-height: 100vh;
    max-width: 1400px;
    margin: 0 auto;
  }
  @media (max-width: 1100px) { .purr-shell { grid-template-columns: 1fr; padding: 12px; gap: 12px; } .purr-side, .purr-cart { display: none; } }

  .purr-side {
    background: var(--bm-surface);
    border-radius: 22px;
    padding: 24px 18px;
    display: flex; flex-direction: column;
    gap: 22px;
    position: sticky; top: 16px;
    align-self: start;
    height: calc(100vh - 32px);
  }
  .purr-brand {
    font-family: var(--bm-heading-font);
    font-weight: 700;
    font-size: 1.35rem;
    letter-spacing: -.02em;
    padding: 6px 8px;
    display: flex; gap: 2px; align-items: baseline;
  }
  .purr-brand .a { color: var(--bm-accent); font-style: italic; }
  .purr-brand .b { color: var(--bm-text); }
  .purr-nav { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .purr-nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    border-radius: 12px;
    color: var(--bm-muted);
    font-size: .9rem;
    cursor: pointer;
    transition: background .25s, color .25s, transform .25s cubic-bezier(.16,1,.3,1);
  }
  .purr-nav-item:hover { background: var(--bm-soft); color: var(--bm-text); transform: translateX(2px); }
  .purr-nav-item.active { background: var(--bm-soft); color: var(--bm-accentDeep); font-weight: 600; }
  .purr-nav-ico { width: 18px; height: 18px; flex: 0 0 18px; }
  .purr-badge {
    margin-left: auto;
    background: var(--bm-accent); color: white;
    font-size: .7rem; padding: 2px 8px; border-radius: 999px;
    font-weight: 600;
  }
  .purr-side-rule { height: 1px; background: var(--bm-rule); opacity: .08; margin: 4px 0; }
  .purr-side-footer { margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding-top: 8px; }
  .purr-donate { color: var(--bm-accent); font-weight: 600; }

  .purr-main {
    background: var(--bm-surface);
    border-radius: 22px;
    padding: 22px 28px 40px;
    overflow: hidden;
  }
  .purr-top {
    display: flex; gap: 12px; align-items: center;
    padding-bottom: 16px;
    border-bottom: 1px solid color-mix(in srgb, var(--bm-text) 8%, transparent);
  }
  .purr-search {
    flex: 1; display: flex; align-items: center; gap: 10px;
    background: var(--bm-soft);
    padding: 10px 16px;
    border-radius: 999px;
    color: var(--bm-muted);
    font-size: .9rem;
  }
  .purr-filter {
    background: var(--bm-accent); color: white;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: .85rem; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
    cursor: pointer;
    transition: transform .2s cubic-bezier(.16,1,.3,1), box-shadow .2s;
  }
  .purr-filter:hover { transform: translateY(-1px); box-shadow: 0 8px 24px -8px var(--bm-accent); }

  .purr-cats { display: flex; gap: 10px; padding: 22px 0 16px; flex-wrap: wrap; }
  .purr-cat {
    padding: 10px 22px;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--bm-text) 14%, transparent);
    background: transparent;
    color: var(--bm-text);
    font-size: .88rem;
    cursor: pointer;
    transition: all .25s cubic-bezier(.16,1,.3,1);
    position: relative;
  }
  .purr-cat:hover { border-color: var(--bm-accent); color: var(--bm-accentDeep); }
  .purr-cat[aria-pressed="true"] { background: var(--bm-accent); color: white; border-color: var(--bm-accent); }

  .purr-section-h {
    font-family: var(--bm-heading-font);
    font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em;
    color: var(--bm-text);
    padding: 4px 0 12px;
  }
  .purr-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }
  @media (max-width: 720px) { .purr-grid { grid-template-columns: 1fr; } }

  .purr-card {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 16px;
    background: var(--bm-surface);
    border: 1px solid color-mix(in srgb, var(--bm-text) 8%, transparent);
    border-radius: 18px;
    padding: 14px;
    transition: transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s, border-color .35s;
    cursor: pointer;
  }
  .purr-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 24px 50px -20px color-mix(in srgb, var(--bm-accent) 30%, transparent);
    border-color: color-mix(in srgb, var(--bm-accent) 40%, transparent);
  }
  .purr-photo {
    width: 110px; height: 130px;
    border-radius: 14px;
    overflow: hidden;
    background: var(--bm-soft);
  }
  .purr-photo img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.16,1,.3,1); }
  .purr-card:hover .purr-photo img { transform: scale(1.06); }
  .purr-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .purr-name-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .purr-name { font-weight: 700; font-size: 1rem; color: var(--bm-text); }
  .purr-price { font-weight: 700; color: var(--bm-accent); font-size: .95rem; white-space: nowrap; }
  .purr-desc {
    font-size: .8rem; line-height: 1.5;
    color: var(--bm-muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .purr-sizes { display: flex; align-items: center; gap: 6px; padding-top: 4px; font-size: .75rem; color: var(--bm-muted); }
  .purr-size-pill {
    padding: 3px 10px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--bm-text) 14%, transparent);
    cursor: pointer; transition: all .2s;
    font-size: .72rem;
    background: transparent;
    color: var(--bm-text);
  }
  .purr-size-pill.on { background: var(--bm-text); color: var(--bm-bg); border-color: var(--bm-text); }
  .purr-add {
    margin-top: 8px;
    background: color-mix(in srgb, var(--bm-accent) 14%, transparent);
    color: var(--bm-accentDeep);
    border: 1px dashed color-mix(in srgb, var(--bm-accent) 50%, transparent);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: .8rem; font-weight: 600;
    cursor: pointer;
    transition: all .2s cubic-bezier(.16,1,.3,1);
    align-self: flex-start;
  }
  .purr-add:hover { background: var(--bm-accent); color: white; border-style: solid; }
  .purr-add.added { background: var(--bm-accent); color: white; border-style: solid; }

  .purr-cart {
    background: var(--bm-surface);
    border-radius: 22px;
    padding: 24px 20px;
    display: flex; flex-direction: column;
    gap: 16px;
    position: sticky; top: 16px;
    align-self: start;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
  }
  .purr-cart-header { display: flex; justify-content: space-between; align-items: center; }
  .purr-cart-h {
    font-family: var(--bm-heading-font);
    font-size: 1.4rem; font-weight: 700; letter-spacing: -.02em;
  }
  .purr-order-id { font-size: .75rem; color: var(--bm-muted); }
  .purr-mode { display: flex; gap: 4px; background: var(--bm-soft); padding: 4px; border-radius: 999px; }
  .purr-mode-btn {
    padding: 8px 14px; border-radius: 999px;
    font-size: .78rem; color: var(--bm-muted);
    cursor: pointer; transition: all .25s cubic-bezier(.16,1,.3,1);
    border: none; background: transparent;
  }
  .purr-mode-btn.on { background: var(--bm-text); color: white; }
  .purr-cart-items { display: flex; flex-direction: column; gap: 16px; }
  .purr-cart-item {
    display: grid; grid-template-columns: 64px 1fr; gap: 12px;
    align-items: center;
  }
  .purr-cart-thumb { width: 64px; height: 64px; border-radius: 12px; overflow: hidden; background: var(--bm-soft); }
  .purr-cart-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .purr-cart-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .purr-cart-name { font-weight: 600; font-size: .9rem; }
  .purr-cart-spec { font-size: .72rem; color: var(--bm-muted); }
  .purr-cart-row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .purr-cart-price { font-weight: 700; font-size: .9rem; }
  .purr-qty { display: flex; align-items: center; gap: 8px; font-size: .8rem; }
  .purr-qty button {
    width: 22px; height: 22px; border-radius: 999px;
    background: var(--bm-soft); color: var(--bm-text);
    display: grid; place-items: center;
    cursor: pointer; border: none;
    transition: background .2s, transform .2s cubic-bezier(.16,1,.3,1);
  }
  .purr-qty button:hover { background: var(--bm-softDeep); transform: scale(1.1); }
  .purr-totals { display: flex; flex-direction: column; gap: 6px; font-size: .85rem; color: var(--bm-muted); padding-top: 12px; border-top: 1px solid color-mix(in srgb, var(--bm-text) 8%, transparent); }
  .purr-totals-row { display: flex; justify-content: space-between; }
  .purr-total-row { display: flex; justify-content: space-between; font-size: 1rem; font-weight: 700; color: var(--bm-text); padding-top: 6px; border-top: 1px solid color-mix(in srgb, var(--bm-text) 8%, transparent); }
  .purr-place {
    margin-top: 8px;
    background: var(--bm-accent);
    color: white;
    padding: 14px;
    border-radius: 999px;
    border: none;
    font-weight: 700; font-size: .95rem;
    cursor: pointer;
    transition: transform .2s cubic-bezier(.16,1,.3,1), box-shadow .2s;
  }
  .purr-place:hover { transform: translateY(-2px); box-shadow: 0 18px 36px -12px var(--bm-accent); }

  /* ═══════════════════════════════════════════════════════════════════
     SPROUT — Market with sidebar filters.
     ═══════════════════════════════════════════════════════════════════ */
  [data-layout="sprout"] body { background: var(--bm-bg); }
  .sp-shell {
    max-width: 1240px; margin: 0 auto;
    padding: 24px clamp(16px, 3vw, 36px) 64px;
  }
  .sp-top {
    display: grid; grid-template-columns: auto 1fr auto auto;
    gap: clamp(12px, 3vw, 32px);
    align-items: center;
    padding: 8px 0 20px;
  }
  .sp-brand { font-family: var(--bm-heading-font); font-weight: 700; font-size: 1.5rem; letter-spacing: -.02em; color: var(--bm-accent); }
  .sp-brand-mark { color: var(--bm-text); }
  .sp-search {
    background: var(--bm-surface);
    border: 1px solid color-mix(in srgb, var(--bm-text) 10%, transparent);
    padding: 10px 18px; border-radius: 999px;
    font-size: .9rem; color: var(--bm-muted);
    max-width: 320px; width: 100%;
    display: flex; align-items: center; gap: 10px;
  }
  .sp-top-pill {
    display: flex; align-items: center; gap: 8px;
    font-size: .85rem; color: var(--bm-text);
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--bm-surface);
    border: 1px solid color-mix(in srgb, var(--bm-text) 8%, transparent);
  }
  .sp-top-pill strong { color: var(--bm-accent); }

  .sp-body {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: clamp(16px, 4vw, 56px);
    margin-top: 12px;
  }
  @media (max-width: 900px) { .sp-body { grid-template-columns: 1fr; } .sp-filter { display: none; } }

  .sp-filter {
    position: sticky; top: 20px; align-self: start;
    font-size: .85rem;
  }
  .sp-filter-h {
    font-family: var(--bm-heading-font);
    font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em;
    padding-bottom: 12px;
    border-bottom: 1px solid color-mix(in srgb, var(--bm-text) 12%, transparent);
  }
  .sp-fgroup { padding: 16px 0; border-bottom: 1px solid color-mix(in srgb, var(--bm-text) 8%, transparent); }
  .sp-fgroup-h {
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; font-size: .82rem;
    cursor: pointer; user-select: none;
  }
  .sp-fgroup-h::after {
    content: ""; width: 8px; height: 8px;
    border-right: 1.5px solid var(--bm-text);
    border-bottom: 1.5px solid var(--bm-text);
    transform: rotate(45deg) translate(-1px, -2px);
    transition: transform .25s;
  }
  .sp-fgroup.collapsed .sp-fgroup-h::after { transform: rotate(-135deg) translate(-3px, 0); }
  .sp-fgroup.collapsed .sp-fgroup-body { display: none; }
  .sp-fgroup-body { padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .sp-check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .sp-check input { accent-color: var(--bm-accent); width: 14px; height: 14px; }
  .sp-range { position: relative; height: 28px; margin: 4px 0 10px; }
  .sp-range::before { content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 2px; background: var(--bm-softDeep); border-radius: 999px; }
  .sp-range::after { content: ""; position: absolute; left: 18%; right: 32%; top: 13px; height: 2px; background: var(--bm-accent); border-radius: 999px; }
  .sp-knob { position: absolute; top: 9px; width: 10px; height: 10px; border-radius: 999px; background: var(--bm-accent); transform: translateX(-50%); box-shadow: 0 0 0 4px color-mix(in srgb, var(--bm-accent) 20%, transparent); }

  .sp-results-head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 10px;
  }
  .sp-crumb { font-size: .78rem; color: var(--bm-muted); }
  .sp-crumb strong { color: var(--bm-text); font-weight: 500; }
  .sp-title {
    font-family: var(--bm-heading-font);
    font-size: clamp(2.4rem, 5vw, 3.6rem);
    line-height: 1; font-weight: 400; letter-spacing: -.02em;
    margin: 8px 0 6px; color: var(--bm-text);
  }
  .sp-count { font-size: .85rem; color: var(--bm-muted); display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; }
  .sp-sort {
    border: 1px solid color-mix(in srgb, var(--bm-text) 14%, transparent);
    padding: 8px 14px; border-radius: 10px;
    font-size: .82rem; background: var(--bm-surface);
    display: flex; align-items: center; gap: 8px;
    cursor: pointer;
  }
  .sp-chips { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 18px; align-items: center; }
  .sp-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 999px;
    background: var(--bm-surface);
    border: 1px solid color-mix(in srgb, var(--bm-text) 12%, transparent);
    font-size: .78rem;
  }
  .sp-chip strong { font-weight: 500; }
  .sp-chip-x { color: var(--bm-muted); cursor: pointer; }
  .sp-chips-clear { font-size: .78rem; color: var(--bm-muted); text-decoration: underline; cursor: pointer; }

  .sp-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
  }
  @media (max-width: 720px) { .sp-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .sp-grid { grid-template-columns: 1fr; } }

  .sp-card {
    background: var(--bm-surface);
    border: 1px solid color-mix(in srgb, var(--bm-text) 8%, transparent);
    border-radius: 18px;
    padding: 14px;
    display: flex; flex-direction: column;
    align-items: center;
    position: relative;
    transition: transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s, border-color .35s;
    cursor: pointer;
  }
  .sp-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 32px -16px color-mix(in srgb, var(--bm-text) 18%, transparent);
    border-color: color-mix(in srgb, var(--bm-accent) 40%, transparent);
  }
  .sp-circle {
    width: 92px; height: 92px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--bm-soft);
    margin: 8px 0 12px;
    box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--bm-text) 25%, transparent);
    transition: transform .5s cubic-bezier(.16,1,.3,1);
  }
  .sp-card:hover .sp-circle { transform: scale(1.06) rotate(-3deg); }
  .sp-circle img { width: 100%; height: 100%; object-fit: cover; }
  .sp-rate {
    position: absolute; top: 16px; right: 16px;
    background: var(--bm-surface);
    color: var(--bm-accent);
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--bm-accent) 25%, transparent);
    font-size: .68rem; font-weight: 600;
    display: flex; align-items: center; gap: 4px;
  }
  .sp-rate::before { content: "★"; color: var(--bm-accent); }
  .sp-sale {
    position: absolute; top: 56px; right: 14px;
    background: #D43838; color: white;
    padding: 2px 10px;
    font-size: .65rem; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
    border-radius: 4px;
  }
  .sp-card-name {
    font-size: .92rem; font-weight: 600;
    color: var(--bm-text);
    text-align: center; line-height: 1.25;
    min-height: 36px;
  }
  .sp-card-cat { font-size: .68rem; color: var(--bm-muted); letter-spacing: .14em; text-transform: uppercase; margin-top: 2px; }
  .sp-card-row {
    display: flex; justify-content: space-between; align-items: flex-end;
    width: 100%; margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid color-mix(in srgb, var(--bm-text) 6%, transparent);
  }
  .sp-add {
    display: flex; align-items: center; gap: 6px;
    background: transparent;
    color: var(--bm-text);
    border: 1px solid color-mix(in srgb, var(--bm-text) 14%, transparent);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: .78rem;
    cursor: pointer;
    transition: all .2s cubic-bezier(.16,1,.3,1);
  }
  .sp-add:hover { background: var(--bm-accent); color: white; border-color: var(--bm-accent); }
  .sp-add::after { content: "+"; font-size: 1rem; line-height: 0; }
  .sp-pricewrap { text-align: right; line-height: 1.2; }
  .sp-price { font-weight: 700; color: #D43838; font-size: 1rem; }
  .sp-price-strike { font-size: .72rem; color: var(--bm-muted); text-decoration: line-through; }
  .sp-price-unit { font-size: .68rem; color: var(--bm-muted); }

  /* ═══════════════════════════════════════════════════════════════════
     CHAIN — Storefront with promo banner and horizontal rows.
     ═══════════════════════════════════════════════════════════════════ */
  [data-layout="chain"] body { background: var(--bm-bg); }
  .ch-shell { max-width: 1240px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 36px) 80px; }
  .ch-utility {
    display: flex; align-items: center; gap: 18px;
    padding: 18px 0 14px;
    border-bottom: 1px solid color-mix(in srgb, var(--bm-text) 6%, transparent);
  }
  .ch-brand {
    width: 36px; height: 36px;
    border-radius: 999px;
    background: var(--bm-accent);
    color: white;
    display: grid; place-items: center;

  .ch-nav {

    align-content: center;

  .ch-tile {
    aspect-ratio: 1;
    border-radius: 12px;
    background: color-mix(in srgb, white 20%, transparent);

  .ch-row { margin-bottom: 36px; }
  .ch-row-head {

  .ch-row-title {
    font-family: var(--bm-heading-font);
    font-size: 1.5rem; font-weight: 700;
    letter-spacing: -.02em;

  .ch-row-arrows { display: flex; gap: 8px; }
  .ch-arrow {
    width: 36px; height: 36px;
    border-radius: 999px;
    background: var(--bm-surface);
    border: 1px solid color-mix(in srgb, var(--bm-text) 12%, transparent);
    display: grid; place-items: center;
    cursor: pointer;

  .ch-arrow:hover { background: var(--bm-text); color: var(--bm-bg); border-color: var(--bm-text); }
  .ch-scroll {
    display: flex; gap: 14px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding-bottom: 8px;

  .ch-card {

  .ch-card-photo {
    aspect-ratio: 1;
    border-radius: 12px;
    overflow: hidden;
    background: var(--bm-soft);

  }
  .ch-card-photo img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.16,1,.3,1); }
  .ch-card:hover .ch-card-photo img { transform: scale(1.08); }
  .ch-card-heart {
    position: absolute; top: 10px; right: 10px;
    width: 28px; height: 28px;
    border-radius: 999px;
    background: rgba(255,255,255,.85);

    backdrop-filter: blur(8px);

  .ch-card-heart:hover { transform: scale(1.1); background: white; }
  .ch-card-heart.on svg { fill: var(--bm-accent); stroke: var(--bm-accent); }
  .ch-card-badge {
    position: absolute; top: 8px; left: 8px;

  .ch-card-price { font-weight: 700; font-size: .95rem; }
  .ch-plus {
    width: 28px; height: 28px; border-radius: 999px;

    cursor: pointer; border: none;

  .ch-plus:hover { transform: scale(1.15) rotate(90deg); }

  /* ═══════════════════════════════════════════════════════════════════
     BOUTIQUE — Editorial shop with sidebar filters + percentage off.
     ═══════════════════════════════════════════════════════════════════ */
  [data-layout="boutique"] body { background: var(--bm-bg); }
  .bq-utility {
    background: var(--bm-accent);
    color: white;
    font-size: .78rem;
    padding: 10px clamp(16px, 3vw, 36px);

  .bq-utility-socials { display: flex; gap: 12px; }

  .bq-utility-socials a:hover { opacity: 1; }

  .bq-header {

  .bq-brand {

    color: var(--bm-text);
    display: flex; align-items: center; gap: 8px;
  }
  .bq-brand-mark {
    width: 22px; height: 22px; border-radius: 999px;

  }
  .bq-nav { display: flex; gap: 28px; font-size: .92rem; }
  .bq-nav-item { color: var(--bm-text); cursor: pointer; position: relative; padding: 4px 0; }
  .bq-nav-item.on { font-weight: 600; }
  .bq-nav-item.on::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -2px;
    height: 2px; background: var(--bm-accent);
  }
  .bq-nav-item:hover { color: var(--bm-accent); }
  .bq-header-icons { margin-left: auto; display: flex; gap: 18px; color: var(--bm-text); }
  .bq-header-icons svg { cursor: pointer; transition: color .2s; }
  .bq-header-icons svg:hover { color: var(--bm-accent); }

  .bq-hero {
    background: var(--bm-soft);
    padding: 56px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .bq-hero-title {
    font-family: var(--bm-heading-font);
    font-size: clamp(2.8rem, 6vw, 4.2rem);
    line-height: 1; font-weight: 400; letter-spacing: -.02em;
  }
  .bq-hero-crumb {
    margin-top: 12px; font-size: .85rem; color: var(--bm-muted);
  }
  .bq-hero-crumb a { color: var(--bm-text); }

  .bq-body {
    max-width: 1280px;
    margin: 0 auto;
    padding: 40px clamp(16px, 3vw, 36px);
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: clamp(20px, 4vw, 56px);
  }
  @media (max-width: 900px) { .bq-body { grid-template-columns: 1fr; } .bq-filter { display: none; } }

  .bq-filter { position: sticky; top: 20px; align-self: start; font-size: .85rem; }
  .bq-filter-h { font-weight: 700; font-size: 1rem; padding-bottom: 16px; border-bottom: 1px solid color-mix(in srgb, var(--bm-text) 14%, transparent); }
  .bq-fgroup { padding: 16px 0; }
  .bq-fgroup-h { font-weight: 600; font-size: .85rem; padding-bottom: 8px; }
  .bq-flist { display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; }
  .bq-fopt { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--bm-text); }
  .bq-fopt input { accent-color: var(--bm-accent); }
  .bq-frange { position: relative; height: 28px; margin: 12px 0 4px; }
  .bq-frange::before { content: ""; position: absolute; left: 0; right: 0; top: 12px; height: 3px; background: var(--bm-softDeep); border-radius: 999px; }
  .bq-frange::after { content: ""; position: absolute; left: 5%; right: 35%; top: 12px; height: 3px; background: var(--bm-accent); border-radius: 999px; }
  .bq-fknob { position: absolute; top: 8px; width: 12px; height: 12px; border-radius: 999px; background: var(--bm-accent); }
  .bq-fprice-lbl { font-size: .78rem; color: var(--bm-text); }
  .bq-stars { display: inline-flex; gap: 1px; color: #F5B400; }
  .bq-stars-row { display: flex; align-items: center; gap: 10px; }

  .bq-results-head {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 20px;
    border-bottom: 1px solid color-mix(in srgb, var(--bm-text) 10%, transparent);
  }
  .bq-results-count { font-size: .82rem; color: var(--bm-text); }
  .bq-sort {
    display: flex; align-items: center; gap: 10px;
    font-size: .82rem; color: var(--bm-text);
  }
  .bq-sort-box {
    border: 1px solid color-mix(in srgb, var(--bm-text) 16%, transparent);
    padding: 8px 16px; border-radius: 8px;
    background: var(--bm-surface);
    display: flex; align-items: center; gap: 8px;
    cursor: pointer;
  }
  .bq-active-filters { display: flex; align-items: center; gap: 8px; padding: 14px 0; flex-wrap: wrap; }
  .bq-af-label { font-size: .78rem; color: var(--bm-text); font-weight: 600; }
  .bq-af-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 6px;
    background: var(--bm-surface);
    border: 1px solid color-mix(in srgb, var(--bm-text) 12%, transparent);
    font-size: .76rem;
  }
  .bq-af-x { color: var(--bm-muted); cursor: pointer; }
  .bq-clear { font-size: .78rem; color: var(--bm-accent); text-decoration: underline; cursor: pointer; margin-left: auto; }

  .bq-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding-top: 14px; }
  @media (max-width: 720px) { .bq-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .bq-grid { grid-template-columns: 1fr; } }

  .bq-card { display: flex; flex-direction: column; cursor: pointer; }
  .bq-card-photo {
    aspect-ratio: 4 / 5;
    border-radius: 12px;
    overflow: hidden;
    background: var(--bm-soft);
    position: relative;
  }
  .bq-card-photo img { width: 100%; height: 100%; object-fit: cover; transition: transform .7s cubic-bezier(.16,1,.3,1); }
  .bq-card:hover .bq-card-photo img { transform: scale(1.08); }
  .bq-off {
    position: absolute; top: 14px; left: 14px;

  }
  .bq-actions {
    position: absolute; top: 14px; right: 14px;
    display: flex; flex-direction: column; gap: 6px;
    opacity: 0; transform: translateX(8px);
    transition: opacity .35s cubic-bezier(.16,1,.3,1), transform .35s cubic-bezier(.16,1,.3,1);

  .bq-card:hover .bq-actions { opacity: 1; transform: translateX(0); }
  .bq-action-btn {
    width: 32px; height: 32px; border-radius: 999px;

    display: grid; place-items: center;
    cursor: pointer; border: none;
    transition: background .2s, color .2s;

  .bq-action-btn:hover { background: var(--bm-accent); color: white; }
  .bq-card-meta { padding: 12px 4px 4px; }
  .bq-card-cat { font-size: .75rem; color: var(--bm-muted); }
  .bq-card-rating {
    float: right;
    display: flex; align-items: center; gap: 4px;
    font-size: .78rem; color: var(--bm-text);
  }
  .bq-card-name { font-weight: 600; font-size: 1.05rem; margin: 4px 0; }
  .bq-card-prices { display: flex; align-items: baseline; gap: 8px; color: var(--bm-accent); font-weight: 700; }
  .bq-card-price-strike { color: var(--bm-muted); font-weight: 400; font-size: .85rem; text-decoration: line-through; }

  .bq-pages { display: flex; justify-content: center; align-items: center; gap: 8px; padding-top: 32px; }
  .bq-page {
    width: 32px; height: 32px; border-radius: 999px;
    display: grid; place-items: center;
    color: var(--bm-text); cursor: pointer;
    font-size: .85rem;
    transition: all .2s;
    border: none;
    background: transparent;
  }
  .bq-page:hover { background: var(--bm-soft); }
  .bq-page.on { background: var(--bm-accent); color: white; }

  /* ═══════════════════════════════════════════════════════════════════
     SHACK — Shake-Shack-style bold modernist diner.
     ═══════════════════════════════════════════════════════════════════ */
  [data-layout="shack"] body { background: var(--bm-bg); }
  .sh-shell { max-width: 1280px; margin: 0 auto; }
  .sh-utility {
    background: var(--bm-text); color: var(--bm-bg);
    padding: 10px clamp(16px, 3vw, 36px);
    display: flex; gap: 20px; align-items: center;
    font-size: .76rem;
    letter-spacing: .02em;
    overflow: hidden;
  }
  .sh-utility-marquee {
    display: flex; gap: 36px; white-space: nowrap;
    animation: shMarquee 28s linear infinite;
  }
  @keyframes shMarquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .sh-utility-item { display: inline-flex; align-items: center; gap: 6px; color: var(--bm-bg); opacity: .85; }
  .sh-utility-dot::before { content: "●"; color: var(--bm-accent); margin-right: 8px; opacity: .8; }

  .sh-nav {
    display: flex; align-items: center; gap: clamp(16px, 3vw, 36px);
    padding: 22px clamp(16px, 3vw, 36px);
    border-bottom: 2px solid var(--bm-text);
    background: var(--bm-bg);
    position: sticky; top: 0; z-index: 20;
  }
  .sh-brand {
    font-family: var(--bm-heading-font);
    font-size: clamp(1.6rem, 3vw, 2rem);
    letter-spacing: .04em;
    color: var(--bm-text);
    text-transform: uppercase;
    line-height: 1;
    padding: 4px 16px;
    background: var(--bm-accent);
    color: white;
    border-radius: 4px;
    transform: skewX(-6deg);

  .sh-brand span { display: inline-block; transform: skewX(6deg); }
  .sh-nav-items { display: flex; gap: clamp(14px, 2vw, 28px); margin-left: clamp(8px, 2vw, 24px); }
  .sh-nav-item {
    font-family: var(--bm-heading-font);
    font-size: .92rem; letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--bm-text);
    cursor: pointer; padding: 4px 2px;
    border-bottom: 2px solid transparent;
    transition: border-color .2s;

  .sh-nav-item.on { border-color: var(--bm-accent); }
  .sh-nav-item:hover { border-color: var(--bm-text); }
  .sh-order {
    margin-left: auto;
    background: var(--bm-text); color: var(--bm-bg);
    font-family: var(--bm-heading-font); letter-spacing: .14em;
    text-transform: uppercase;
    padding: 12px 22px;
    font-size: .82rem;
    border-radius: 999px;

  .sh-hero {
    padding: clamp(40px, 8vw, 88px) clamp(16px, 3vw, 36px) clamp(40px, 6vw, 64px);
    display: grid; grid-template-columns: 1fr; gap: 24px;
    border-bottom: 2px solid var(--bm-text);
    position: relative;
    overflow: hidden;
  }
  .sh-hero::before {
    content: ""; position: absolute;
    inset: 0;
    background:
      radial-gradient(80% 60% at 100% 0%, color-mix(in srgb, var(--bm-accent) 22%, transparent), transparent 60%),
      radial-gradient(60% 60% at 0% 100%, color-mix(in srgb, var(--bm-accent) 14%, transparent), transparent 60%);

  .sh-eyebrow {
    font-family: var(--bm-heading-font);
    font-size: .88rem; letter-spacing: .3em;
    text-transform: uppercase;

  .sh-h1 {
    position: relative;
    font-family: var(--bm-heading-font);

    letter-spacing: .01em;
    text-transform: uppercase;

  .sh-sub { position: relative; max-width: 50ch; font-size: 1.05rem; line-height: 1.55; color: var(--bm-text); opacity: .85; margin-top: 8px; }

  .sh-cats {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 22px clamp(16px, 3vw, 36px);

  .sh-cat {
    font-family: var(--bm-heading-font);

    border-radius: 999px;
    background: var(--bm-bg);
    color: var(--bm-text);
    cursor: pointer;
    white-space: nowrap;
    transition: all .25s cubic-bezier(.16,1,.3,1);

  .sh-cat:hover { background: var(--bm-text); color: var(--bm-bg); }
  .sh-cat[aria-pressed="true"] { background: var(--bm-accent); border-color: var(--bm-accent); color: white; }

  .sh-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0;
    padding: 0 clamp(16px, 3vw, 36px) 80px;
  }
  @media (max-width: 760px) { .sh-grid { grid-template-columns: 1fr; } }

  .sh-card {
    display: grid; grid-template-columns: 1.3fr 1fr;
    align-items: center;
    gap: clamp(16px, 3vw, 32px);
    padding: clamp(24px, 4vw, 44px) 0;
    border-bottom: 2px solid var(--bm-text);
    position: relative;
