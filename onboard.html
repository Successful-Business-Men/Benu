<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Get Started With Benu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --bg:#FAFBF7; --surface:#FFFFFF; --raised:#F2F6EB; --tinted:#E8F0D9; --outer:#ECEEE7; --cream:#FBF7EE;
  --text:#14171A; --muted:#6B7269; --soft:#ADB3A9;
  --mint-50:#F4F8EC; --mint-100:#E8F0D9; --mint-200:#D4E5B5; --mint-300:#C0D896; --mint-400:#A8C879;
  --mint-500:#82A85C; --mint-600:#618440; --mint-700:#44602C; --mint-900:#213116;
  --pill-bg:#CBE0A8; --pill-text:#1F3013; --warm:#FDA172;
  --border:rgba(20,23,26,0.08); --border-strong:rgba(20,23,26,0.14);
  --shadow-sm:0 1px 2px rgba(20,23,26,0.04),0 1px 3px rgba(20,23,26,0.05);
  --shadow-md:0 4px 12px rgba(20,23,26,0.05),0 2px 6px rgba(20,23,26,0.04);
  --shadow-lg:0 16px 40px rgba(20,23,26,0.08),0 4px 12px rgba(20,23,26,0.05);
  --shadow-green:0 10px 28px rgba(33,49,22,0.18);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Inter",-apple-system,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --ok:#2F7D32; --ok-bg:#E6F2E2; --warn:#B8791F; --warn-bg:#FBF0DC; --danger:#C0492C; --danger-bg:#FBEAE3; --info:#2F6E7D;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{margin:0;font-weight:600}
.display{font-family:var(--serif);font-weight:500;line-height:1.08;letter-spacing:-0.01em;color:var(--text)}
.display em{font-style:italic;color:var(--mint-700)}
.serif{font-family:var(--serif)}
.eyebrow{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:var(--mint-600)}
.metalabel{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--soft)}
.btn{font-family:var(--sans);font-size:15px;font-weight:500;border-radius:var(--r-pill);border:1px solid transparent;height:44px;padding:0 24px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:background .18s ease,border-color .18s ease,color .18s ease;white-space:nowrap;line-height:1}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--mint-900);color:#fff;box-shadow:var(--shadow-green)}
.btn-primary:hover{background:var(--mint-700)}
.btn-primary:disabled{background:var(--outer);color:var(--soft);box-shadow:none;cursor:not-allowed}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
.btn-secondary:hover{background:var(--raised);border-color:var(--mint-400)}
.btn-soft{background:var(--mint-200);color:var(--mint-900)}
.btn-soft:hover{background:var(--mint-300)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--text);background:var(--raised)}
.btn-lg{height:52px;padding:0 32px;font-size:16px}
.btn-sm{height:44px;padding:0 16px;font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:5px 12px;border-radius:var(--r-pill);background:var(--pill-bg);color:var(--pill-text);line-height:1}
.chip-mono{font-family:var(--mono);font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase}
.st{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:var(--r-pill);font-weight:500}
.st-ok{background:var(--ok-bg);color:var(--ok)}
.st-warn{background:var(--warn-bg);color:var(--warn)}
.st-danger{background:var(--danger-bg);color:var(--danger)}
.st-ai{background:var(--mint-100);color:var(--mint-700)}
.st-neutral{background:var(--outer);color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.steptab{font:500 11px/1 var(--sans);letter-spacing:.01em;padding:8px 13px;border-radius:999px;border:1px solid transparent;cursor:pointer;transition:none;background:transparent;color:var(--soft)}
.steptab[data-done="true"]{color:var(--mint-700)}
.steptab[data-active="true"]{background:var(--mint-900);color:#fff}
@media (max-width:1080px){.steptab{padding:7px 9px;font-size:10.5px}}
.iconbtn{width:44px;height:44px;border-radius:11px;flex-shrink:0;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;transition:all .15s}
.iconbtn:hover{background:var(--raised);border-color:var(--border-strong)}
.iconbtn-mini{width:28px;height:28px;border-radius:8px}
.dropzone{border:2px dashed var(--border-strong);background:var(--cream);border-radius:var(--r-md);padding:40px 20px;text-align:center;cursor:pointer;transition:all .18s}
.dropzone:hover{border-color:var(--mint-500);background:var(--mint-50)}
input::placeholder,textarea::placeholder{color:var(--soft)}
input:focus,textarea:focus{border-color:var(--mint-500) !important}
button{font-family:var(--sans)}
@media (max-width:880px){
  .import-grid,.mod-grid,.tpl-grid,.pub-grid,.alg-grid,.cater-grid{grid-template-columns:1fr !important}
  .loc-grid{grid-template-columns:1fr !important}
  .loc-grid>div{border-left:none !important;border-top:1px solid var(--border)}
  .steptab{display:none}
  .display{font-size:34px !important}
}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}.gap-5{gap:20px}.gap-6{gap:24px}
.spread{justify-content:space-between}
.center{align-items:center;justify-content:center}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.scroll::-webkit-scrollbar{width:10px;height:10px}
.scroll::-webkit-scrollbar-thumb{background:rgba(20,23,26,.12);border-radius:10px;border:3px solid transparent;background-clip:content-box}
.scroll::-webkit-scrollbar-track{background:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   BENU / BETTER MENU — AI Onboarding Flow (vanilla port)
   ============================================================ */
const ICONS={
  upload:"M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 20h14",
  link:"M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 1 0-5.66-5.66l-1.5 1.5M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 1 0 5.66 5.66l1.5-1.5",
  image:"M4 5h16v14H4zM4 15l4.5-4.5L13 15m-2-2l2.5-2.5L20 17",
  text:"M5 6h14M5 12h14M5 18h9",
  qr:"M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z",
  cart:"M4 5h2l2 11h9l2-7H7M9 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm8 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2z",
  catering:"M12 3v2M5 11a7 7 0 0 1 14 0zM3 11h18M4 15h16M6 19h12",
  home:"M4 11l8-7 8 7M6 10v9h12v-9",
  locations:"M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11zM12 10.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z",
  check:"M5 12.5l4.5 4.5L19 7.5",
  checkCircle:"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM8.5 12l2.5 2.5L15.5 9.5",
  edit:"M4 20h4L18.5 9.5a2 2 0 0 0-3-3L5 17v3zM14 7l3 3",
  x:"M6 6l12 12M18 6L6 18",
  arrowR:"M5 12h14m0 0l-6-6m6 6l-6 6",
  arrowL:"M19 12H5m0 0l6-6m-6 6l6 6",
  sparkle:"M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z",
  alert:"M12 3l9 16H3zM12 9v5M12 17.5v.5",
  info:"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 11v6M12 7.5v.5",
  clock:"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3.5 2",
  price:"M7 12h10M7 8h10M5 4h14v16l-2.5-1.5L14 20l-2-1.5L10 20l-2.5-1.5L5 20z",
  users:"M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM3 20a6 6 0 0 1 12 0M17 11a3 3 0 1 0-1.5-5.6M21 20a6 6 0 0 0-4-5.7",
  box:"M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9",
  leaf:"M5 19c0-8 6-14 14-14 0 8-6 14-14 14zM5 19c3-3 6-5 10-7",
  menu:"M7 4h10a1 1 0 0 1 1 1v15l-3-2-3 2-3-2-3 2V5a1 1 0 0 1 1-1zM9 8h6M9 12h6M9 16h3",
  shield:"M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6zM9 12l2 2 4-4",
  eye:"M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z",
  layout:"M4 5h16v14H4zM4 9h16M9 9v10",
  copy:"M9 9h10v10H9zM5 15H4V5h10v1",
  refresh:"M4 12a8 8 0 0 1 13.5-5.8L20 8M20 4v4h-4M20 12a8 8 0 0 1-13.5 5.8L4 16M4 20v-4h4",
  plus:"M12 5v14M5 12h14",
  minus:"M5 12h14",
};
function icon(name,o){o=o||{};const size=o.size||20,stroke=o.stroke||1.6,color=o.color||"currentColor",fill=o.fill||"none",style=o.style||"";
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill}" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round" style="${style}"><path d="${ICONS[name]}"/></svg>`;}
function pdfTile(size){size=size||40;return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" fill="none"><path d="M8 6a2 2 0 0 1 2-2h12l10 10v18a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2z" fill="#0E7C66"/><path d="M22 4l10 10h-8a2 2 0 0 1-2-2z" fill="#0B5E4D"/><text x="20" y="29" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#fff">PDF</text></svg>`;}
function logoHtml(size){size=size||20;return `<div class="row gap-2" style="align-items:center"><div style="width:${size+6}px;height:${size+6}px;border-radius:8px;background:var(--mint-900);display:grid;place-items:center;box-shadow:var(--shadow-green)"><svg width="${size-4}" height="${size-4}" viewBox="0 0 24 24" fill="none"><path d="M7 4h7a4 4 0 0 1 0 8H7zM7 12h8a4 4 0 0 1 0 8H7zM7 4v16" stroke="#CBE0A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span style="font-family:var(--serif);font-size:${size+4}px;font-weight:600;letter-spacing:-0.01em">Benu</span></div>`;}

const STEPS=["Import","Build","Generate","Review","Catering","Locations","Templates","Publish"];

/* ---------- DATA ---------- */
const MODULES=[
  {id:"qr",icon:"qr",name:"QR Menu Website",desc:"A clean digital menu your guests open by scanning a code at the table.",rec:true},
  {id:"takeout",icon:"cart",name:"Takeout And Pickup",desc:"Let guests order ahead and pay for pickup, right from the menu.",rec:true},
  {id:"catering",icon:"catering",name:"Catering Menu",desc:"Turn your dishes into trays and platters with their own lead times.",rec:false},
  {id:"multi",icon:"locations",name:"Multi Location Menus",desc:"Separate menus, hours, and prices for each of your locations.",rec:false},
  {id:"home",icon:"home",name:"Restaurant Homepage",desc:"A full landing page with your story, photos, hours, and links.",rec:true},
  {id:"codes",icon:"menu",name:"Table And Location QR Codes",desc:"Printable codes for every table and seat, ready to place on day one.",rec:true},
];
const AREA_DEFS=[
  {key:"dining",label:"Dining",unit:"Tables",tile:"Table",icon:"menu"},
  {key:"patio",label:"Patio",unit:"Tables",tile:"Table",icon:"leaf"},
  {key:"bar",label:"Bar And Counter",unit:"Seats",tile:"Seat",icon:"cart"},
];
const GEN_STEPS=[
  {k:"read",icon:"eye",label:"Reading your menu",detail:"2 PDFs · 1 website"},
  {k:"items",icon:"price",label:"Finding items and prices",detail:"64 dishes · 12 sections"},
  {k:"mistakes",icon:"shield",label:"Checking for possible mistakes",detail:"spelling · OCR · pricing"},
  {k:"templates",icon:"layout",label:"Preparing template matches",detail:"3 best fits"},
  {k:"draft",icon:"sparkle",label:"Drafting your selected modules",detail:"QR · Takeout · Homepage · Codes"},
];
const FINDING_GROUPS=[
  {id:"spelling",title:"Spelling Fixes",icon:"edit",tone:"safe",blurb:"Clear typos Benu can tidy up for you.",
    items:[{from:"Bruchetta",to:"Bruschetta",ctx:"Starters"},{from:"Margherita Pizaa",to:"Margherita Pizza",ctx:"Wood-fired"},{from:"Tiramsu",to:"Tiramisù",ctx:"Dessert"}]},
  {id:"ocr",title:"Unclear Scans",icon:"eye",tone:"review",blurb:"Benu wasn’t fully sure it read these right.",
    items:[{from:"Lamb k????a",to:"Lamb kofta",ctx:"Mains",conf:"Low confidence"},{from:"Halloum?",to:"Halloumi",ctx:"Mezze",conf:"Medium confidence"}]},
  {id:"price",title:"Prices To Confirm",icon:"price",tone:"review",blurb:"These were tricky to read or look a little off.",
    items:[{from:"Mezze Platter, $1?",to:"$18.00",ctx:"Mezze",conf:"Couldn’t read decimals"},{from:"House Red, no price",to:"Add price",ctx:"Wine",conf:"Price missing"}]},
  {id:"mods",title:"Possible Add Ons",icon:"box",tone:"suggest",blurb:"Options Benu could turn into easy upsells for guests.",
    items:[{from:"“add chicken +6”",to:"Protein add-on · $6",ctx:"Salads"},{from:"“gf available”",to:"Gluten-free option",ctx:"Pizza"}]},
  {id:"desc",title:"Missing Descriptions",icon:"text",tone:"suggest",blurb:"Items with no description yet. Benu can write one for you to approve.",
    items:[{from:"Branzino",to:"Whole-roasted sea bass, lemon, herbs, olive oil",ctx:"Mains"},{from:"Spanakopita",to:"Flaky filo, spinach and feta",ctx:"Mezze"}]},
];
const toneMap={safe:{chip:"st-ok",label:"Safe Fix",color:"var(--ok)"},review:{chip:"st-warn",label:"Needs Review",color:"var(--warn)"},suggest:{chip:"st-ai",label:"Suggestion",color:"var(--mint-700)"}};
const CATERING=[
  {id:"mezze",name:"Mezze Feast",based:"Built from your Mezze and Starters",serves:"8 to 10",price:"120",lead:"48 hrs",min:"2 trays",contents:["Hummus and pita","Spanakopita","Falafel","Greek salad","Tzatziki and olives"]},
  {id:"grill",name:"Wood-Fired Grill Platter",based:"Built from your Mains",serves:"10 to 12",price:"185",lead:"72 hrs",min:"1 tray",contents:["Lamb kofta","Chicken souvlaki","Branzino","Roasted vegetables","Lemon potatoes"]},
  {id:"brunch",name:"Weekend Brunch Spread",based:"Built from your Brunch menu",serves:"6 to 8",price:"95",lead:"48 hrs",min:"2 trays",contents:["Shakshuka","Labneh and flatbread","Seasonal fruit","Pastry basket"]},
];
const CATER_FIELDS=[{label:"Serves",key:"serves",suffix:"guests",icon:"users"},{label:"Package Price",key:"price",suffix:"$",icon:"price"},{label:"Lead Time",key:"lead",suffix:"",icon:"clock"},{label:"Minimum Order",key:"min",suffix:"",icon:"box"}];
const LOCATIONS=[
  {id:"main",name:"South Congress",addr:"1401 S Congress Ave, Austin",main:true,hours:"Tue to Sun · 5 to 10pm",pickup:"Curbside and in-store"},
  {id:"dom",name:"The Domain",addr:"11800 Domain Blvd, Austin",main:false,hours:"Daily · 11am to 10pm",pickup:"In-store only"},
  {id:"rr",name:"Round Rock",addr:"201 University Blvd, Round Rock",main:false,hours:"Same as main",pickup:"Same as main"},
];
const TEMPLATES=[
  {id:"editorial",name:"Sunlit Editorial",tag:"Best match",why:"Your warm photography and longer dish descriptions shine in this magazine-style layout.",feats:["Serif headlines","Large photo grid","Story section"]},
  {id:"warm",name:"Hearth and Home",tag:"Great for catering",why:"Split hero and earthy tones suit your wood-fired identity and push the catering CTA.",feats:["Split hero","Catering-forward","Warm palette"]},
  {id:"minimal",name:"Clean Plate",tag:"Fastest to load",why:"A crisp, no-frills layout that puts the menu and ordering first, ideal for takeout.",feats:["Order-first","Minimal type","Quick load"]},
];
const BUILT=[
  {icon:"qr",name:"QR menu website",detail:"64 items · 12 sections",ok:true},
  {icon:"cart",name:"Takeout and pickup",detail:"Ordering and payments connected",ok:true},
  {icon:"catering",name:"Catering menu",detail:"3 packages · 1 needs confirmation",ok:false},
  {icon:"home",name:"Restaurant Homepage",detail:"Sunlit Editorial template",ok:true},
  {icon:"locations",name:"Multi Location Menus",detail:"3 locations · 3 QR codes",ok:true},
  {icon:"menu",name:"Table And Location QR Codes",detail:"Ready to print",ok:true},
];
const CHECKLIST=[
  {id:"items",label:"Menu items and prices approved",req:true,done:true},
  {id:"catering",label:"Confirm the Weekend Brunch catering package",req:true,done:false},
  {id:"contact",label:"Contact details and hours verified",req:true,done:true},
  {id:"payments",label:"Connect payouts for takeout orders",req:true,done:false},
  {id:"allergy",label:"Ingredient and allergy info (can do after launch)",req:false,done:false},
];
const ALLERGY_ITEMS=[
  {name:"Mezze Platter",section:"Mezze",state:"verified",ingredients:["Chickpeas","Tahini","Olive oil","Pita (wheat)","Garlic"],tags:[{t:"Vegetarian",ok:true},{t:"Contains Gluten",warn:true},{t:"Contains Sesame",warn:true}]},
  {name:"Lamb Kofta",section:"Mains",state:"review",ingredients:["Ground lamb","Cumin","Parsley","Onion","Egg"],tags:[{t:"Contains Egg",warn:true},{t:"Halal?",q:true}]},
  {name:"Branzino",section:"Mains",state:"suggested",ingredients:["Sea bass","Lemon","Herbs","Olive oil"],tags:[{t:"Contains Fish",warn:true},{t:"Gluten-free",ok:true},{t:"Dairy-free",ok:true}]},
  {name:"Tiramisù",section:"Dessert",state:"suggested",ingredients:["Mascarpone","Espresso","Ladyfingers (wheat)","Egg","Cocoa"],tags:[{t:"Contains Dairy",warn:true},{t:"Contains Egg",warn:true},{t:"Contains Gluten",warn:true}]},
];
const allergyState={
  suggested:{label:"AI suggested",cls:"st-ai",icon:"sparkle",dot:"var(--mint-500)"},
  review:{label:"Needs your review",cls:"st-warn",icon:"alert",dot:"var(--warn)"},
  verified:{label:"Verified by you",cls:"st-ok",icon:"shield",dot:"var(--ok)"},
};

/* ---------- STATE ---------- */
const state={
  screen:(function(){var n=parseInt(localStorage.getItem("benu_screen")||"0",10);return isNaN(n)?0:Math.min(Math.max(n,0),8);})(),
  import:{files:[{name:"olive-branch-dinner.pdf",size:"2.4 MB",pct:100,state:"done"},{name:"wine-list-2026.pdf",size:"1.1 MB",pct:100,state:"done"}],link:"oliv ebranchkitchen.com",logo:true},
  build:{sel:{qr:true,takeout:true,catering:false,multi:false,home:true,codes:true},areas:{dining:8,patio:4,bar:6}},
  gen:{active:0,done:false},
  review:{states:{},vals:{},editing:null,editVal:""},
  catering:{confirmed:{},fields:{}},
  loc:{sameAs:{dom:false,rr:true}},
  tpl:{chosen:"editorial",focus:null},
  publish:{checks:{},published:false},
  allergy:{items:null},
};
function initState(){
  FINDING_GROUPS.forEach(function(g){g.items.forEach(function(it,i){var k=g.id+i;state.review.states[k]=null;state.review.vals[k]=it.to;});});
  CATERING.forEach(function(c){state.catering.fields[c.id]={serves:c.serves,price:c.price,lead:c.lead,min:c.min};});
  CHECKLIST.forEach(function(c){state.publish.checks[c.id]=c.done;});
  state.allergy.items=JSON.parse(JSON.stringify(ALLERGY_ITEMS));
}
function setModel(path,val){var parts=path.split(".");var o=state;for(var i=0;i<parts.length-1;i++)o=o[parts[i]];o[parts[parts.length-1]]=val;}

/* ---------- SHARED CHROME ---------- */
function topBar(){
  var screen=state.screen,total=STEPS.length;
  var pct=screen>=total?100:(screen/(total-1))*100;
  var pills=STEPS.map(function(s,i){return `<button data-act="jump" data-i="${i}" class="steptab" data-active="${i===screen}" data-done="${i<screen}">${s}</button>`;}).join("");
  return `<header style="position:sticky;top:0;z-index:40;background:rgba(250,251,247,0.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)">
    <div style="max-width:1180px;margin:0 auto;padding:16px 32px" class="row spread">
      ${logoHtml(20)}
      <div class="row gap-2" style="display:flex">${pills}</div>
      <div class="row gap-3"><span class="metalabel" style="color:var(--muted)">The Olive Branch</span><div style="width:30px;height:30px;border-radius:999px;background:var(--mint-200);display:grid;place-items:center;color:var(--mint-900);font-weight:600;font-size:13px">O</div></div>
    </div>

}
function screenWrap(inner,max){max=max||1080;return `<main class="scroll" style="flex:1;overflow-y:auto;overflow-x:hidden"><div style="max-width:${max}px;margin:0 auto;padding:44px 32px 140px">${inner}</div></main>`;}
function footerBar(inner){return `<div style="position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(250,251,247,0.86);backdrop-filter:blur(14px);border-top:1px solid var(--border)"><div style="max-width:1080px;margin:0 auto;padding:16px 32px" class="row spread">${inner}</div></div>`;}
function pageHead(o){return `<div class="row spread" style="align-items:flex-end;margin-bottom:34px;gap:24px;flex-wrap:wrap"><div style="flex:1 1 460px;min-width:0"><h1 class="display" style="font-size:${o.titleSize||44}px;margin-bottom:${o.sub?16:0}px;display:block">${o.title}</h1>${o.sub?`<p style="font-size:17px;color:var(--muted);margin:0;line-height:1.5;max-width:560px;display:block">${o.sub}</p>`:""}</div>${o.aside?`<div style="flex-shrink:0">${o.aside}</div>`:""}</div>`;}
function aiNote(inner,ic){ic=ic||"sparkle";return `<div class="row gap-3" style="align-items:flex-start;background:var(--mint-50);border:1px solid var(--mint-200);border-radius:var(--r-md);padding:13px 16px;color:var(--mint-900)"><div style="flex-shrink:0;margin-top:1px">${icon(ic,{size:17,color:"var(--mint-600)"})}</div><div style="font-size:13.5px;line-height:1.5;color:var(--mint-900)">${inner}</div></div>`;}
function tick(on){return `<div style="width:24px;height:24px;border-radius:7px;flex-shrink:0;border:${on?"none":"2px solid var(--border-strong)"};background:${on?"var(--mint-900)":"transparent"};display:grid;place-items:center;transition:all .15s">${on?icon("check",{size:15,color:"#fff",stroke:2.4}):""}</div>`;}

/* ---------- SCREEN 1: IMPORT ---------- */

/* ---------- SCREEN 2: BUILD ---------- */
function viewBuild(){

  var mods=MODULES.map(function(m){var on=sel[m.id];return `<button data-act="mod" data-id="${m.id}" style="text-align:left;cursor:pointer;border-radius:var(--r-lg);padding:20px;border:${on?"2px solid var(--mint-600)":"1px solid var(--border)"};background:${on?"var(--mint-50)":"var(--surface)"};box-shadow:${on?"var(--shadow-md)":"var(--shadow-sm)"};transition:all .16s;position:relative;display:flex;gap:16px;align-items:flex-start"><div style="width:56px;height:56px;border-radius:14px;flex-shrink:0;background:${on?"var(--mint-900)":"var(--raised)"};display:grid;place-items:center;transition:all .16s">${icon(m.icon,{size:30,color:on?"#CBE0A8":"var(--mint-700)"})}</div><div class="grow"><div class="row gap-2" style="margin-bottom:5px"><span style="font-size:16.5px;font-weight:600">${m.name}</span></div><p style="margin:0;font-size:14px;color:var(--muted);line-height:1.5">${m.desc}</p></div>${tick(on)}</button>`;}).join("");
  var tablePanel="";

      var n=areas[def.key];var showN=Math.min(n,8);var tiles="";
      if(n>0){var t="";for(var i=0;i<showN;i++){t+=`<div class="row gap-2" style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px 11px 6px 7px"><div style="width:24px;height:24px;border-radius:6px;background:var(--mint-50);display:grid;place-items:center">${icon("qr",{size:15,color:"var(--mint-900)",stroke:1.4})}</div><span style="font-size:13px;font-weight:500">${def.tile} ${String(i+1).padStart(2,"0")}</span></div>`;}if(n>showN){t+=`<div class="row center" style="border:1px dashed var(--border-strong);border-radius:10px;padding:6px 13px;font-size:13px;color:var(--muted)">+${n-showN} More</div>`;}tiles=`<div class="row wrap gap-2">${t}</div>`;}
      return `<div style="background:var(--raised);border-radius:14px;padding:14px 16px"><div class="row spread" style="margin-bottom:${n>0?12:0}px;flex-wrap:wrap;gap:12px"><div class="row gap-3"><div style="width:34px;height:34px;border-radius:9px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center">${icon(def.icon,{size:17,color:"var(--mint-700)"})}</div><div><div style="font-size:15px;font-weight:600">${def.label}</div><div class="metalabel" style="color:var(--soft)">${n} ${n===1?def.unit.slice(0,-1):def.unit}</div></div></div><div class="row gap-3" style="flex-shrink:0"><button class="iconbtn" data-act="bump" data-area="${def.key}" data-d="-1">${icon("minus",{size:18,color:"var(--mint-700)"})}</button><div style="min-width:36px;text-align:center;font-family:var(--serif);font-size:26px;font-weight:600;line-height:46px">${n}</div><button class="iconbtn" data-act="bump" data-area="${def.key}" data-d="1">${icon("plus",{size:18,color:"var(--mint-700)"})}</button></div></div>${tiles}</div>`;
    }).join("");
    tablePanel=`<div class="card" style="padding:0;overflow:hidden;margin-top:20px;border-color:var(--mint-400)"><div class="row spread" style="padding:18px 22px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:16px"><div class="row gap-3"><div style="width:42px;height:42px;border-radius:11px;background:var(--mint-900);display:grid;place-items:center;flex-shrink:0">${icon("qr",{size:22,color:"#CBE0A8"})}</div><div><div style="font-size:16.5px;font-weight:600">Set Up Your Tables And Seats</div><div style="font-size:13.5px;color:var(--muted);margin-top:2px">Add as many as you have in each area and we’ll print a ready to scan code for every one.</div></div></div><span class="chip" style="align-self:center">${icon("sparkle",{size:12,color:"var(--pill-text)"})} ${totalCodes} Codes Ready</span></div><div class="col gap-4" style="padding:20px 22px">${areaRows}</div></div>`;
  }
  var asideBtn=`<button data-act="selall" class="btn btn-soft">${icon(all?"x":"check",{size:16,color:"var(--mint-900)"})}${all?"Clear All":"Select Everything"}</button>`;
  var inner=`${pageHead({title:"What Should Benu <em>Build For You</em>",sub:"Tell us what you need today and add the rest whenever you like. We’ve already ticked the ones busy restaurants reach for first.",aside:asideBtn,titleSize:58})}<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px" class="mod-grid">${mods}</div>${tablePanel}<div style="margin-top:20px">${aiNote("Benu drafts every one of these straight from your menu. Nothing goes public until you give it the thumbs up.","info")}</div>`;
  var foot=`<button class="btn btn-secondary" data-act="back">${icon("arrowL",{size:18})} Back</button><div class="row gap-4"><span class="metalabel" style="color:var(--muted)">${count} of ${MODULES.length} selected</span><button class="btn btn-primary btn-lg" ${count===0?"disabled":""} data-act="next">Build with Benu ${icon("sparkle",{size:17,color:"#fff"})}</button></div>`;
  return screenWrap(inner)+footerBar(foot);
}

/* ---------- SCREEN 3: GENERATE ---------- */
function viewGenerate(){
  var active=state.gen.active,done=state.gen.done;
  var steps=GEN_STEPS.map(function(s,i){var st=i<active?"done":i===active?"run":"wait";return `<div class="row gap-4" style="padding:16px 16px;border-radius:14px;background:${st==="run"?"var(--mint-50)":"transparent"};transition:background .3s;opacity:${st==="wait"?0.5:1}"><div style="width:40px;height:40px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;background:${st==="done"?"var(--mint-900)":st==="run"?"var(--mint-200)":"var(--raised)"}">${st==="done"?icon("check",{size:20,color:"#fff",stroke:2.6}):st==="run"?`<span style="width:18px;height:18px;border:2.5px solid var(--mint-400);border-top-color:var(--mint-700);border-radius:50%;display:block;animation:spin .8s linear infinite"></span>`:icon(s.icon,{size:19,color:"var(--soft)"})}</div><div class="grow"><div style="font-size:16px;font-weight:500;color:${st==="wait"?"var(--muted)":"var(--text)"}">${s.label}</div><div class="metalabel" style="margin-top:3px">${s.detail}</div></div>${st==="done"?`<span class="st st-ok">Done</span>`:""}${st==="run"?`<span class="st st-ai" style="animation:pulse 1.4s ease infinite">Working</span>`:""}</div>`;}).join("");

  var inner=`<div style="text-align:center;margin-bottom:40px"><h1 class="display" style="font-size:50px;margin-bottom:12px">${done?"Your Drafts Are <em>Ready</em>":"Benu Is <em>Building</em> Your Menu"}</h1><p style="font-size:17px;color:var(--muted);max-width:480px;margin:0 auto">${done?"It’s all yours to tweak. Change anything you like before it goes live, because nothing is public yet.":"Give us a minute to put it all together. We’ll point out anything that could use a second look."}</p></div><div class="card" style="padding:14px">${steps}</div>${chips}`;
  var foot=`<button class="btn btn-secondary" data-act="back">${icon("arrowL",{size:18})} Back</button><button class="btn btn-primary btn-lg" ${done?"":"disabled"} data-act="next">${done?`Review what Benu found ${icon("arrowR",{size:18,color:"#fff"})}`:"Building…"}</button>`;

/* ---------- SCREEN 4: REVIEW ---------- */
function findingRow(g,i){
  var k=g.id+i,it=g.items[i],st=state.review.states[k],val=state.review.vals[k],editing=state.review.editing===k;
  var left=editing
    ?`<div class="row gap-2 wrap" style="font-size:14.5px"><span style="color:var(--soft);text-decoration:line-through">${it.from}</span>${icon("arrowR",{size:14,color:"var(--soft)"})}<input data-model="review.editVal" data-enter="rsave" data-k="${k}" data-autofocus value="${val}" style="border:1px solid var(--mint-500);border-radius:8px;padding:6px 10px;font-size:14.5px;font-weight:600;font-family:var(--sans);color:var(--mint-900);outline:none;min-width:180px"/></div>`
    :`<div class="row gap-2 wrap" style="font-size:14.5px"><span style="color:var(--soft);text-decoration:line-through">${it.from}</span>${icon("arrowR",{size:14,color:"var(--soft)"})}<span style="font-weight:600;color:${st==="rejected"?"var(--muted)":"var(--mint-900)"}">${val}</span></div>`;
  var right;
  if(editing){right=`<div class="row gap-2"><button class="btn btn-secondary btn-sm" data-act="rcancel" data-k="${k}">Cancel</button><button class="btn btn-primary btn-sm" data-act="rsave" data-k="${k}">${icon("check",{size:14,color:"#fff",stroke:2.4})} Save</button></div>`;}
  else if(st==="approved"){right=`<div class="row gap-2"><span class="st st-ok">${icon("check",{size:11,stroke:2.6})} Approved</span><button class="iconbtn" data-act="redit" data-k="${k}" title="Edit">${icon("edit",{size:15,color:"var(--muted)"})}</button></div>`;}
  else if(st==="rejected"){right=`<button class="btn btn-ghost btn-sm" data-act="rset" data-k="${k}" data-v="">${icon("refresh",{size:14})} Undo</button>`;}
  else{right=`<div class="row gap-2"><button class="iconbtn" data-act="rset" data-k="${k}" data-v="rejected" title="Reject">${icon("x",{size:16,color:"var(--muted)"})}</button><button class="iconbtn" data-act="redit" data-k="${k}" title="Edit">${icon("edit",{size:15,color:"var(--muted)"})}</button><button class="btn btn-soft btn-sm" data-act="rset" data-k="${k}" data-v="approved">${icon("check",{size:14,color:"var(--mint-900)",stroke:2.4})} Approve</button></div>`;}
  return `<div class="row gap-4" style="padding:13px 16px;border-radius:12px;align-items:center;background:${st==="approved"?"var(--mint-50)":st==="rejected"?"var(--bg)":"var(--surface)"};border:${editing?"1px solid var(--mint-500)":"1px solid var(--border)"};opacity:${st==="rejected"?0.55:1};transition:all .15s"><div class="grow" style="min-width:0"><div class="metalabel" style="margin-bottom:4px">${it.ctx}${it.conf?" · "+it.conf:""}</div>${left}</div>${right}</div>`;
}
function viewReview(){
  var total=Object.keys(state.review.states).length;
  var resolved=Object.values(state.review.states).filter(function(v){return v;}).length;
  var groups=FINDING_GROUPS.map(function(g){
    var t=toneMap[g.tone];
    var gResolved=g.items.filter(function(_,i){return state.review.states[g.id+i];}).length;
    var rows=g.items.map(function(_,i){return findingRow(g,i);}).join("");
    return `<div class="card" style="padding:0;overflow:hidden"><div class="row spread" style="padding:16px 20px;border-bottom:1px solid var(--border);background:var(--raised)"><div class="row gap-3"><div style="width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center">${icon(g.icon,{size:18,color:t.color})}</div><div><div class="row gap-2"><span style="font-size:16px;font-weight:600">${g.title}</span><span class="st ${t.chip}">${t.label}</span></div><div style="font-size:13px;color:var(--muted);margin-top:2px">${g.blurb}</div></div></div><span class="metalabel">${gResolved}/${g.items.length} done</span></div><div class="col gap-2" style="padding:14px">${rows}</div></div>`;
  }).join("");
  var aside=`<button class="btn btn-primary" data-act="approveSafe">${icon("sparkle",{size:16,color:"#fff"})} Approve All Safe Fixes</button>`;
  var inner=`${pageHead({title:"A Few Things To <em>Check</em>",sub:"Benu read all 64 of your items beautifully. These few just need a quick yes or no from you. We’ve grouped them so you can breeze through, starting with the safe fixes.",aside:aside})}<div class="col gap-5">${groups}</div>`;
  var foot=`<button class="btn btn-secondary" data-act="back">${icon("arrowL",{size:18})} Back</button><div class="row gap-4"><div class="row gap-2"><div style="width:120px;height:6px;border-radius:9px;background:var(--outer);overflow:hidden"><div style="height:100%;width:${total?(resolved/total*100):0}%;background:var(--mint-600);transition:width .3s"></div></div><span class="metalabel" style="color:var(--muted)">${resolved}/${total} reviewed</span></div><button class="btn btn-primary btn-lg" data-act="next">${resolved===total?"All clear, continue":"Continue"} ${icon("arrowR",{size:18,color:"#fff"})}</button></div>`;
  return screenWrap(inner)+footerBar(foot);
}

/* ---------- SCREEN 5: CATERING ---------- */
function viewCatering(){
  var conf=Object.values(state.catering.confirmed).filter(Boolean).length;
  var cards=CATERING.map(function(c){
    var isConf=state.catering.confirmed[c.id];

    return `<div class="card" style="padding:0;overflow:hidden;border-color:${isConf?"var(--mint-400)":"var(--border)"}"><div class="row spread" style="padding:18px 22px;border-bottom:1px solid var(--border)"><div><div class="row gap-3" style="margin-bottom:4px"><span style="font-family:var(--serif);font-size:26px;font-weight:600">${c.name}</span><span class="st st-ai">${icon("sparkle",{size:11,color:"var(--mint-700)"})} AI draft</span></div><div class="metalabel">${c.based}</div></div>${isConf?`<span class="st st-ok">${icon("check",{size:12,stroke:2.6})} Confirmed</span>`:`<span class="st st-warn">Awaiting your confirmation</span>`}</div><div style="padding:22px;display:grid;grid-template-columns:1.1fr 1fr;gap:28px" class="cater-grid"><div><div class="metalabel" style="margin-bottom:10px">What’s In It · Edit Freely</div><div class="row wrap gap-2">${chips}<button class="chip" style="background:transparent;border:1px dashed var(--border-strong);color:var(--muted);cursor:pointer">${icon("upload",{size:12})} Add item</button></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">${fields}</div></div><div class="row spread" style="padding:14px 22px;background:var(--raised);border-top:1px solid var(--border)"><span style="font-size:13px;color:var(--muted)">Confirm serving size, price, lead time and minimum to publish this package.</span><button class="${isConf?"btn btn-secondary btn-sm":"btn btn-primary btn-sm"}" data-act="cconfirm" data-id="${c.id}">${isConf?`${icon("refresh",{size:14})} Edit again`:`${icon("check",{size:15,color:"#fff",stroke:2.4})} Confirm details`}</button></div></div>`;

/* ---------- ROUTER / RENDER ---------- */
var VIEWS=[viewImport,viewBuild,viewGenerate,viewReview,viewCatering,viewLocations,viewTemplates,viewPublish,viewAllergy];
function render(){
  var prevMain=document.querySelector("main");var sc=prevMain?prevMain.scrollTop:0;
  var view=(VIEWS[state.screen]||viewImport)();
  document.getElementById("app").innerHTML=`<div style="display:flex;flex-direction:column;height:100vh">${topBar()}${view}</div>`;
  var nowMain=document.querySelector("main");if(nowMain)nowMain.scrollTop=sc;
  var af=document.querySelector("[data-autofocus]");if(af){af.focus();try{af.setSelectionRange(af.value.length,af.value.length);}catch(e){}}
}
function go(n){n=Math.max(0,Math.min(8,n));state.screen=n;localStorage.setItem("benu_screen",String(n));if(n===2)startGen();render();var m=document.querySelector("main");if(m)m.scrollTop=0;}
function next(){go(state.screen+1);}
function back(){go(state.screen-1);}

function startGen(){state.gen={active:0,done:false};scheduleGenTick();}
function scheduleGenTick(){if(state.screen!==2)return;var delay=state.gen.active===0?900:1500;setTimeout(function(){if(state.screen!==2)return;state.gen.active++;if(state.gen.active>=GEN_STEPS.length){state.gen.done=true;render();return;}render();scheduleGenTick();},delay);}

/* ---------- EVENTS ---------- */
var app=document.getElementById("app");
app.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var act=t.dataset.act,id=t.dataset.id,k=t.dataset.k;
  if(act==="next"){next();return;}
  if(act==="back"){back();return;}
  if(act==="jump"){go(parseInt(t.dataset.i,10));return;}
  if(act==="later"){go(8);return;}
  if(act==="toPublish"){go(7);return;}
  if(act==="upload"){addUploading();return;}
  if(act==="logo-toggle"){state.import.logo=!state.import.logo;render();return;}
  if(act==="mod"){state.build.sel[id]=!state.build.sel[id];render();return;}
  if(act==="selall"){var all=Object.values(state.build.sel).filter(Boolean).length===MODULES.length;var v=!all;MODULES.forEach(function(m){state.build.sel[m.id]=v;});render();return;}
  if(act==="bump"){var area=t.dataset.area,d=parseInt(t.dataset.d,10);state.build.areas[area]=Math.max(0,Math.min(60,state.build.areas[area]+d));render();return;}
  if(act==="approveSafe"){FINDING_GROUPS.filter(function(g){return g.tone==="safe";}).forEach(function(g){g.items.forEach(function(_,i){state.review.states[g.id+i]="approved";});});render();return;}
  if(act==="rset"){state.review.states[k]=t.dataset.v||null;render();return;}
  if(act==="redit"){state.review.editing=k;state.review.editVal=state.review.vals[k];render();return;}
  if(act==="rsave"){state.review.vals[k]=state.review.editVal;state.review.states[k]="approved";state.review.editing=null;render();return;}
  if(act==="rcancel"){state.review.editing=null;render();return;}
  if(act==="cconfirm"){state.catering.confirmed[id]=!state.catering.confirmed[id];render();return;}
  if(act==="lsame"){state.loc.sameAs[id]=!state.loc.sameAs[id];render();return;}
  if(act==="tchoose"){state.tpl.chosen=id;render();return;}
  if(act==="tfocus"){state.tpl.focus=id;render();return;}
  if(act==="tclose"){state.tpl.focus=null;render();return;}
  if(act==="tuse"){state.tpl.chosen=id;state.tpl.focus=null;render();return;}
  if(act==="pcheck"){state.publish.checks[id]=!state.publish.checks[id];render();return;}
  if(act==="publish"){state.publish.published=true;render();return;}
  if(act==="averify"){state.allergy.items[parseInt(t.dataset.i,10)].state="verified";render();return;}
  if(act==="aunverify"){state.allergy.items[parseInt(t.dataset.i,10)].state="review";render();return;}
});
app.addEventListener("input",function(e){
  var t=e.target.closest("[data-model]");if(t){setModel(t.dataset.model,t.value);}
});
app.addEventListener("keydown",function(e){
  if(e.key==="Enter"){var t=e.target.closest("[data-enter]");if(t){e.preventDefault();var k=t.dataset.k;state.review.vals[k]=state.review.editVal;state.review.states[k]="approved";state.review.editing=null;render();}}
});

function addUploading(){
  var id="draft-menu-"+(Math.floor(Math.random()*90+10))+".pdf";
  state.import.files.push({name:id,size:"3.0 MB",pct:8,state:"up"});
  render();
  var p=8;
  var timer=setInterval(function(){
    p+=Math.random()*22;
    var f=state.import.files.find(function(x){return x.name===id;});
    if(!f){clearInterval(timer);return;}
    if(p>=100){p=100;f.pct=100;f.state="done";clearInterval(timer);}else{f.pct=Math.round(p);}
    render();
  },240);
}

/* ---------- BOOT ---------- */
initState();
render();
if(state.screen===2)startGen();
</script>
</body>
</html>
